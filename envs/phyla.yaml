# Conda/mamba env for Phyla (https://github.com/mims-harvard/Phyla).
# Referenced by rules/phyla.smk as the named env "phyla".
# Create with:  mamba env create -n phyla -f envs/phyla.yaml
# Then, inside the env, install causal-conv1d (see the Mamba repo) and Phyla itself:
#   cd Phyla && pip install -e .
# Phyla needs a GPU (tested on H100, works on 32GB V100); scikit-bio provides NJ.
name: phyla
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - biopython
  - pip:
      - scikit-bio
      - causal-conv1d
      - mamba-ssm
