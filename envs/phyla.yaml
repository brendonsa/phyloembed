# named env "phyla", used by rules/phyla.smk
# causal-conv1d/mamba-ssm/Phyla itself install afterward, not here: see windowed-experiments-handoff.md
name: phyla
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.3.0
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - biopython
  - pip:
      - scikit-bio
