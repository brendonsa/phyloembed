# named env "phyla", used by rules/phyla.smk
# causal-conv1d/mamba-ssm/Phyla itself install afterward, not here: see windowed-experiments-handoff.md
name: phyla
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.9
  - pip
  - pytorch=2.3.0
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - scipy=1.12.0
  - biopython=1.83
  - pip:
      - scikit-bio==0.6.1
      - triton==2.3.0
      - transformers==4.38.2
      - tokenizers==0.15.2
      - huggingface-hub==0.21.4
